- name: Deploy al servidor
        run: |
          ssh ${{ secrets.SSH_USER }}@ssh.suite-os.app << 'ENDSSH'
            set -e
            cd ~/apps/deparmentOS

            echo "── Pull últimos cambios ──"
            git pull origin main

            echo "── Rebuild servicios ──"
            docker compose up --build -d

            echo "── Reiniciar Nginx (actualizar DNS interno) ──"
            docker compose restart nginx

            echo "── Estado final ──"
            docker compose ps

            echo "✅ Deploy completado $(date)"
          ENDSSH