version: '3.8'

# ============================================================
#  Edify — Docker Compose de Producción
#  Usa un único .env raíz para todas las variables
#  Ollama corre fuera de Docker (instalado en el servidor)
# ============================================================

services:

  # ── Base de datos PostgreSQL ────────────────────────────────
  edify_db:
    image: postgres:16-alpine
    container_name: edify_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - edify_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - edify_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (opcional — comentar en producción si no se usa) ─
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: edify_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      edify_db:
        condition: service_healthy
    networks:
      - edify_network

  # ── Backend NestJS ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edify_backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      edify_db:
        condition: service_healthy
      ocr_service:
        condition: service_healthy
    networks:
      - edify_network

  # ── Frontend React ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edify_frontend
    restart: unless-stopped
    networks:
      - edify_network

  # ── OCR Service (FastAPI + EasyOCR) ────────────────────────
  ocr_service:
    build:
      context: ./LectorImagen
      dockerfile: Dockerfile
    container_name: edify_ocr
    restart: unless-stopped
    env_file: .env
    networks:
      - edify_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Scheduler ───────────────────────────────────────────────
  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: edify_scheduler
    restart: unless-stopped
    env_file: .env
    depends_on:
      edify_db:
        condition: service_healthy
    networks:
      - edify_network

  # ── Nginx (proxy reverso) ───────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: edify_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - edify_network

# ── Volúmenes persistentes ──────────────────────────────────
volumes:
  edify_data:
    name: edify_core_data
  uploads_data:
    name: edify_uploads

# ── Red interna ─────────────────────────────────────────────
networks:
  edify_network:
    name: edify_network
    driver: bridge
