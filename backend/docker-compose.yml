version: '3.8'

services:
  edify_db:
    image: postgres:16-alpine
    container_name: edify_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: edify_core
      POSTGRES_USER: edify_user
      POSTGRES_PASSWORD: edify_pass_2024
    ports:
      - "5432:5432"
    volumes:
      - edify_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - edify_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edify_user -d edify_core"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: edify_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@edify.com
      PGADMIN_DEFAULT_PASSWORD: edify_admin_2024
    ports:
      - "5050:80"
    depends_on:
      edify_db:
        condition: service_healthy
    networks:
      - edify_network

volumes:
  edify_data:
    name: edify_core_data

networks:
  edify_network:
    name: edify_network
    driver: bridge